name: Remove BAROX VS source archives

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/remove-source-archives.yml
  workflow_run:
    workflows: ["Build BAROX VS v099"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-source-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Remove .tar.xz assets from every release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            let removed = 0;
            for (const release of releases) {
              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100
                }
              );

              for (const asset of assets) {
                if (asset.name.toLowerCase().endsWith(".tar.xz")) {
                  core.info(`Removing ${asset.name} from release ${release.tag_name}`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id
                  });
                  removed++;
                }
              }
            }

            core.info(`Removed ${removed} .tar.xz release assets; JAR assets were not modified.`);
