name: Build BAROX VS v004

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble and verify original v004 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-v004/part-*.b64 | tr -d '\n' | base64 --decode > source-v004.zip
          echo "Archive checksum:"
          sha256sum source-v004.zip
          echo "d9ce9e5277e3926a543ad656ab527df8cf6f70e1afe73a17e70567c001e6d250  source-v004.zip" | sha256sum --check
          unzip -t source-v004.zip
          mkdir project
          unzip -q source-v004.zip -d project
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json
          grep -q "BAROX-VS-v004.jar" project/build.gradle

      - name: Build
        working-directory: project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s project/build/libs/BAROX-VS-v004.jar
          unzip -t project/build/libs/BAROX-VS-v004.jar
          jar tf project/build/libs/BAROX-VS-v004.jar | grep -E 'fabric.mod.json|BaroxVsClient.class|BaroxMenuScreen.class'

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v004
          path: project/build/libs/BAROX-VS-v004.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish v004 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v004
          target_commitish: main
          name: BAROX VS v004
          body: |
            BAROX VS v004 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Redesigned Visual Studio GUI, custom two-colour theme editor, 22 palettes,
            18 wing styles, four wing motion styles, animated feather particle layers,
            wing glints, outlines, runes and expanded client-side cosmetic controls.

            Built from the exact source archive attached to this commit.
          files: project/build/libs/BAROX-VS-v004.jar
          generate_release_notes: true
