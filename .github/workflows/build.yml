name: Build BAROX VS v011

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble v006 base and apply v008/v009/v010/v011 source patches
        shell: bash
        run: |
          set -euo pipefail
          cat source-v006-parts/part-*.b64 | base64 -d > /tmp/BAROX-VS-v006-source.tar.xz
          echo '387373d2331147df2f87ade18e44d67a84ac77f2176513af7877e7b6c7fdbc77  /tmp/BAROX-VS-v006-source.tar.xz' | sha256sum -c -
          mkdir -p project
          tar -xJf /tmp/BAROX-VS-v006-source.tar.xz -C project
          patch --batch --forward -d project -p1 < patches/v006-compile-fixes.patch
          xz -dc .github/scripts/apply-v007.py.xz > /tmp/apply-v007.py
          python3 /tmp/apply-v007.py project
          cat patches/v008/part-*.b64 | base64 -d | gzip -dc > /tmp/v008.patch
          patch --batch --forward -d project -p1 < /tmp/v008.patch
          cat patches/v009/part-*.b64 | base64 -d > /tmp/v009.patch.xz
          xz -t /tmp/v009.patch.xz
          xz -dc /tmp/v009.patch.xz > /tmp/v009.patch
          patch --batch --forward -d project -p1 < /tmp/v009.patch
          patch --batch --forward -d project -p1 < patches/v009-compile-fix.patch
          cat patches/v010-parts/part-*.b64 | base64 -d > /tmp/v010.patch.xz
          xz -t /tmp/v010.patch.xz
          xz -dc /tmp/v010.patch.xz > /tmp/v010.patch
          patch --batch --forward -d project -p1 < /tmp/v010.patch
          cat patches/v011-parts/part-*.b64 | base64 -d > /tmp/v011.patch.xz
          echo '394aa135a871f7bcd828e0829b3a1a113a9289754415ba9766b5509ac9993af6  /tmp/v011.patch.xz' | sha256sum -c -
          xz -t /tmp/v011.patch.xz
          xz -dc /tmp/v011.patch.xz > /tmp/v011.patch
          patch --batch --forward -d project -p4 < /tmp/v011.patch
          tar -cJf BAROX-VS-v011-source.tar.xz -C project .

      - name: Verify v011 wing catalogue, legacy features and renderer safeguards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'getDebugQuads|WorldRenderEvents\.AFTER_ENTITIES|^import .*ParticleTypes|^import .*ParticleEffect|\.addParticle\(' project/src/main/java; then
            echo 'Unexpected renderer path or vanilla particle API found.'
            exit 1
          fi
          grep -q 'getEntityTranslucent' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'FluidTags.WATER' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'FluidTags.WATER' project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          grep -q 'drawButterflyWing' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'drawButterflyParticle' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'renderHanfuOrnament' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'renderSilkRibbons' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'renderHeadwear' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'liquid_rain' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'customSkyColors' project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          grep -q 'slot-2.png' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'register(Module module)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'unregister(String id)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Chinese Straw Kasa' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Hanfu Hair Ornament' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'silk_ribbons' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'butterfly_swarm' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'CosmeticCatalog.WINGS, 0' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Twelve unique wing shapes' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'wingStyleVersion' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          for method in drawSeraphWing drawDemonWing drawDragonWing drawButterflyWing drawMothWing drawPhoenixWing drawFrostWing drawVoidWing drawSakuraWing drawAstralWing drawCyberWing drawWildvineWing; do
            grep -q "private void ${method}" project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          done
          grep -q 'Every style places glints on its own outer contour' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'case 11' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'moduleValue' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'openAudioConnection' project/src/main/java/com/baroxvs/client/audio/MusicEngine.java
          test -s project/src/main/java/com/baroxvs/client/gui/ModuleSettingsScreen.java
          grep -q 'cloth-config-fabric' project/build.gradle
          grep -q '"cloth-config"' project/src/main/resources/fabric.mod.json
          test -s project/src/main/resources/assets/baroxvs/textures/misc/white.png
          test -s project/src/main/java/com/baroxvs/client/gui/BaroxClothConfigScreen.java
          test -s project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          test -s project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          test -s project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          test -s project/src/main/resources/assets/baroxvs/lang/tr_tr.json
          python3 -m json.tool project/src/main/resources/fabric.mod.json > /dev/null

      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v011.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          for entry in \
            'fabric.mod.json' \
            'com/baroxvs/client/BaroxVsClient.class' \
            'com/baroxvs/client/gui/BaroxMenuScreen.class' \
            'com/baroxvs/client/gui/HudEditorScreen.class' \
            'com/baroxvs/client/gui/BaroxClothConfigScreen.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/hud/HudRenderer.class' \
            'com/baroxvs/client/config/BaroxConfig.class' \
            'com/baroxvs/client/cosmetic/CosmeticEngine.class' \
            'com/baroxvs/client/audio/MusicEngine.class' \
            'com/baroxvs/client/render/SkyboxEngine.class' \
            'com/baroxvs/client/render/SkinStudio.class' \
            'com/baroxvs/client/theme/Themes.class' \
            'com/baroxvs/client/mixin/LocalSkinMixin.class' \
            'assets/baroxvs/lang/tr_tr.json' \
            'assets/baroxvs/lang/en_us.json' \
            'assets/baroxvs/lang/de_de.json' \
            'assets/baroxvs/textures/misc/white.png' \
            'baroxvs.mixins.json'; do
            grep -Fxq "$entry" project/build/jar-entries.txt
          done
          sha256sum "$JAR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v011
          path: |
            project/build/libs/BAROX-VS-v011.jar
            BAROX-VS-v011-source.tar.xz
          if-no-files-found: error
          retention-days: 30

      - name: Publish v011 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v011
          target_commitish: main
          name: BAROX VS v011
          body: |
            BAROX VS v011 — Minecraft Java 1.21.4 / Fabric / Java 21.

            The wing wardrobe has been rebuilt around twelve genuinely distinct silhouettes: Seraph Feathers,
            Thorned Demon, Dragon Armor, Butterfly, Moon Moth, Phoenix Flame, Frost Shards, Void Crescent,
            Sakura Bloom, Astral Halo, Cyber Pulse and Wildvine.

            Each preset now has dedicated geometry and a matching Wings Lab preview. Wing glints follow the
            selected silhouette; animation uses a shoulder-rooted hinge transform. Existing v010 cosmetics,
            ambient effects, HUD, music and module settings are retained.

            Legacy wing selections are migrated once to the closest matching new silhouette. Cloth Config
            17.0.144 remains required separately. CI validates the source patch, compilation and JAR integrity;
            live in-game validation on Android/ZalithLauncher and Sodium/Iris remains outstanding.
          files: |
            project/build/libs/BAROX-VS-v011.jar
            BAROX-VS-v011-source.tar.xz
          generate_release_notes: true
