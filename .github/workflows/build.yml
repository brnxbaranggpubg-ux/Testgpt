name: Build BAROX VS v003

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reassemble and verify original source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-archive/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/barox-vs-v003.zip
          unzip -t /tmp/barox-vs-v003.zip
          mkdir project
          unzip -q /tmp/barox-vs-v003.zip -d project
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json
          sha256sum /tmp/barox-vs-v003.zip

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        working-directory: project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s project/build/libs/BAROX-VS-v003.jar
          unzip -t project/build/libs/BAROX-VS-v003.jar
          jar tf project/build/libs/BAROX-VS-v003.jar | grep -E 'fabric.mod.json|BaroxVsClient.class'

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v003
          path: project/build/libs/BAROX-VS-v003.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish v003 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v003
          target_commitish: main
          name: BAROX VS v003
          body: |
            BAROX VS v003 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Client-side visual cosmetics, ClickGUI, Matrix theme, HUD widgets, and particle effects.
            The build is generated from the original uploaded v003 source archive without modifying its Java source.
          files: project/build/libs/BAROX-VS-v003.jar
          generate_release_notes: true
