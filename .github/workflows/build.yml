name: Build BAROX VS v007

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble and update v006 source to v007
        shell: bash
        run: |
          set -euo pipefail
          cat source-v006-parts/part-*.b64 | base64 -d > /tmp/BAROX-VS-v006-source.tar.xz
          echo '387373d2331147df2f87ade18e44d67a84ac77f2176513af7877e7b6c7fdbc77  /tmp/BAROX-VS-v006-source.tar.xz' | sha256sum -c -
          mkdir -p project
          tar -xJf /tmp/BAROX-VS-v006-source.tar.xz -C project
          patch --batch --forward -d project -p1 < patches/v006-compile-fixes.patch
          patch --batch --forward -d project -p1 < patches/v007-water-depth.patch
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json
          tar -cJf BAROX-VS-v007-source.tar.xz -C project .

      - name: Verify water-safe cosmetic renderer and project sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WorldRenderEvents.AFTER_ENTITIES.register(this::renderWorldEffects)' project/src/main/java/com/baroxvs/client/CosmeticEngine.java
          grep -q 'RenderLayer.getDebugFilledBox()' project/src/main/java/com/baroxvs/client/CosmeticEngine.java
          if grep -q 'RenderLayer.getDebugQuads()' project/src/main/java/com/baroxvs/client/CosmeticEngine.java; then
            echo 'Depth-ignoring debug layer still present in cosmetic renderer.'
            exit 1
          fi
          if grep -R -nE '^import .*ParticleTypes|^import .*ParticleEffect|\.addParticle\(' project/src/main/java; then
            echo 'Vanilla particle spawning detected.'
            exit 1
          fi
          grep -q 'mod_version=0.7.0' project/gradle.properties
          grep -q "archiveFileName = 'BAROX-VS-v007.jar'" project/build.gradle
          test -s project/src/main/java/com/baroxvs/client/HudEditorScreen.java
          test -s project/src/main/java/com/baroxvs/client/SkyboxEngine.java
          test -s project/src/main/java/com/baroxvs/client/SkinStudio.java

      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v007.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          grep -q '^fabric.mod.json$' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/BaroxVsClient.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/CosmeticEngine.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/HudRenderer.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/SkyboxEngine.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/SkinStudio.class' project/build/jar-entries.txt
          grep -q 'META-INF/jars/' project/build/jar-entries.txt
          sha256sum "$JAR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v007
          path: |
            project/build/libs/BAROX-VS-v007.jar
            BAROX-VS-v007-source.tar.xz
          if-no-files-found: error
          retention-days: 30

      - name: Publish v007 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v007
          target_commitish: main
          name: BAROX VS v007
          body: |
            BAROX VS v007 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Water/occlusion fix: wings, cape and ambient cosmetics now use Minecraft's
            depth-tested debug-filled-box render layer and are submitted after entity
            rendering. The player model is already in the depth buffer, so the shoulder
            attachment roots are occluded naturally. The previous depth-ignoring debug
            quad path is removed from the cosmetic renderer.

            Fabric API remains the runtime integration layer. The existing GUI and
            procedural meshes are BAROX-owned, so Cloth Config / LibGui / GeckoLib are
            not bundled as unused dependencies. EMF / ETF are optional client-side
            OptiFine-format model/texture mods, not required APIs for this renderer.

            CI compilation and JAR validation succeeded. Android/ZalithLauncher in-game
            water rendering still needs visual confirmation on the target device.
          files: |
            project/build/libs/BAROX-VS-v007.jar
            BAROX-VS-v007-source.tar.xz
          generate_release_notes: true
