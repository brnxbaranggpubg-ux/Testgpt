          if-no-files-found: error
          retention-days: 30
      - name: Publish v107 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v108
          target_commitish: main
          name: BAROX VS v108
          body: |
            Localization: all 99 active modules now have complete English, German and Turkish names and descriptions. Retired module keys are removed from the locale files. The Visual Studio, module settings, dynamic tooltips, skin status messages and 112 module-specific setting labels use translations.
            Storage: settings are standardized at config/baroxvs/config.json, captions at config/baroxvs/captions.lrc, and skin images at config/baroxvs/skins. A generic migration imports legacy settings and captions without embedding a personal nickname in runtime code; legacy files are preserved.
            Skin Studio: the selected one of three skin slots is saved in the config and restored after restart.
            The Fabric mod ID remains baroxvs. Minecraft 1.21.4 / Java 21. The build includes automated locale, migration, identity and profile-persistence regression checks.
          files: |
            project/build/libs/BAROX-VS-v108.jar

