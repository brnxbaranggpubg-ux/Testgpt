name: Build BAROX VS v004

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble and verify v004 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-v004-parts/part-*.b64 | tr -d '\n' | base64 --decode > source-v004.tar.xz
          echo "1c78a3e37e68a17a6ce6ff69a7717ecb7c9d83c846d1b4dced1fa7b8d92a85e9  source-v004.tar.xz" | sha256sum --check
          xz --test source-v004.tar.xz
          mkdir project
          tar -xJf source-v004.tar.xz -C project

      - name: Apply Java 21 coordinate type fix
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -d project -p1 < patches/v004-coordinate-rounding.patch
          grep -q "int tipX = (int) Math.round" project/src/main/java/com/baroxvs/client/BaroxMenuScreen.java
          grep -q "int tipY = (int) Math.round" project/src/main/java/com/baroxvs/client/BaroxMenuScreen.java

      - name: Verify source project
        shell: bash
        run: |
          set -euo pipefail
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json
          grep -q "BAROX-VS-v004.jar" project/build.gradle

      - name: Build remapped Fabric mod
        working-directory: project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="project/build/libs/BAROX-VS-v004.jar"
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          jar tf "$JAR" | grep -q 'BaroxVsClient.class'
          jar tf "$JAR" | grep -q 'BaroxMenuScreen.class'
          sha256sum "$JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v004
          path: project/build/libs/BAROX-VS-v004.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish v004 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v004
          target_commitish: main
          name: BAROX VS v004
          body: |
            BAROX VS v004 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Redesigned Visual Studio GUI, custom two-colour theme editor, 22 palettes,
            18 wing styles, four wing motion styles, animated feather particle layers,
            wing glints, outlines, runes and expanded client-side cosmetic controls.

            Built and verified by GitHub Actions from the SHA-256 verified source archive
            plus the tracked coordinate-rounding patch.
          files: project/build/libs/BAROX-VS-v004.jar
          generate_release_notes: true
