name: Build BAROX VS v005

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble and verify exact v005 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-v005-parts/part-*.bin > source-v005.tar.xz
          echo "c47f213946070af99a403aca212de6c29fc6f59da97f4c70b6396b69ab43de19  source-v005.tar.xz" | sha256sum --check
          xz --test source-v005.tar.xz
          mkdir project
          tar -xJf source-v005.tar.xz -C project
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json

      - name: Verify custom renderer and music controls
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'ParticleTypes|ParticleEffect|\.addParticle\(' project/src/main/java; then
            echo "Vanilla Minecraft particle API usage detected."
            exit 1
          fi
          grep -R -q 'WorldRenderEvents.AFTER_ENTITIES' project/src/main/java
          grep -R -q 'drawCyberWing' project/src/main/java
          grep -R -q 'MusicEngine' project/src/main/java/com/baroxvs/client/BaroxMenuScreen.java
          grep -R -q 'pauseOrResume' project/src/main/java

      - name: Build remapped Fabric mod
        working-directory: project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="project/build/libs/BAROX-VS-v005.jar"
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          grep -q '^fabric.mod.json$' project/build/jar-entries.txt
          grep -q 'BaroxVsClient.class' project/build/jar-entries.txt
          grep -q 'CosmeticEngine.class' project/build/jar-entries.txt
          grep -q 'MusicEngine.class' project/build/jar-entries.txt
          grep -qi 'jlayer.*\.jar' project/build/jar-entries.txt
          sha256sum "$JAR"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v005
          path: project/build/libs/BAROX-VS-v005.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish v005 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v005
          target_commitish: main
          name: BAROX VS v005
          body: |
            BAROX VS v005 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Compact floating Visual Studio menu with a close button.
            Independent cosmetic renderer and simulated particles; no vanilla
            ParticleTypes, ParticleEffect or addParticle calls.
            Cyber wings use a continuous themed outline and a soft translucent
            membrane. Includes 19 wing styles, layered feather silhouettes,
            themed glints and custom aura/trail effects.
            URL MP3 player with play, pause/resume, stop, volume and close;
            closing the menu does not stop playback. Android AudioTrack is
            accessed without a compile-time Android SDK; desktop Java Sound
            fallback is included.

            CI verifies the exact source archive checksum, compiles the mod,
            validates the remapped JAR, uploads it and attaches it here.
          files: project/build/libs/BAROX-VS-v005.jar
          generate_release_notes: true
