name: Build BAROX VS v006

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble and verify v006 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-v006-parts/part-*.b64 | base64 -d > /tmp/BAROX-VS-v006-source.tar.xz
          echo '387373d2331147df2f87ade18e44d67a84ac77f2176513af7877e7b6c7fdbc77  /tmp/BAROX-VS-v006-source.tar.xz' | sha256sum -c -
          mkdir -p project
          tar -xJf /tmp/BAROX-VS-v006-source.tar.xz -C project
          test -s project/build.gradle
          test -s project/src/main/resources/fabric.mod.json
          cp /tmp/BAROX-VS-v006-source.tar.xz BAROX-VS-v006-source.tar.xz

      - name: Verify visual renderer and localization sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^import .*ParticleTypes|^import .*ParticleEffect|\.addParticle\(' project/src/main/java; then
            echo 'Vanilla particle spawning detected.'
            exit 1
          fi
          test -s project/src/main/java/com/baroxvs/client/HudEditorScreen.java
          test -s project/src/main/java/com/baroxvs/client/SkyboxEngine.java
          test -s project/src/main/java/com/baroxvs/client/SkinStudio.java
          test -s project/src/main/java/com/baroxvs/client/mixin/LocalSkinMixin.java
          test -s project/src/main/resources/assets/baroxvs/lang/tr_tr.json
          test -s project/src/main/resources/assets/baroxvs/lang/en_us.json
          test -s project/src/main/resources/assets/baroxvs/lang/de_de.json

      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v006.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          grep -q '^fabric.mod.json$' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/BaroxVsClient.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/HudEditorScreen.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/SkyboxEngine.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/SkinStudio.class' project/build/jar-entries.txt
          grep -q 'com/baroxvs/client/mixin/LocalSkinMixin.class' project/build/jar-entries.txt
          grep -q 'assets/baroxvs/lang/tr_tr.json' project/build/jar-entries.txt
          grep -q 'baroxvs.mixins.json' project/build/jar-entries.txt
          sha256sum "$JAR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v006
          path: |
            project/build/libs/BAROX-VS-v006.jar
            BAROX-VS-v006-source.tar.xz
          if-no-files-found: error
          retention-days: 30

      - name: Publish v006 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v006
          target_commitish: main
          name: BAROX VS v006
          body: |
            BAROX VS v006 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Reference-style translucent six-column GUI, T-key HUD Studio with layout/scale/opacity/glass controls,
            automatic Minecraft language selection (Turkish, English and German resources), 24 procedural sky
            presets and custom panorama loading, local 64x64 skin override, player-anchored wing geometry,
            and configurable ambient orbs/cubes/stars/rings/shards/hearts.

            Built and verified by GitHub Actions. The mod has not yet been live-tested in a Minecraft client
            on Android/ZalithLauncher; launcher and in-game visual behaviour still require device verification.
          files: |
            project/build/libs/BAROX-VS-v006.jar
            BAROX-VS-v006-source.tar.xz
          generate_release_notes: true
