      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v108.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          grep -Fxq "com/baroxvs/client/mixin/SkyRenderingMixin.class" project/build/jar-entries.txt
          if grep -Eq 'com/baroxvs/client/cosmetic/CosmeticEngine\\$(JumpRipple|VisualMote|TrailNode)\\.class' project/build/jar-entries.txt; then
            echo 'Transient particle/trail object classes must not be present'
            exit 1
          fi
          grep -Fxq "com/baroxvs/client/mixin/BackgroundRendererMixin.class" project/build/jar-entries.txt
          for entry in \
            'fabric.mod.json' \
            'com/baroxvs/client/BaroxVsClient.class' \
            'com/baroxvs/client/HudChatCommands.class' \
            'com/baroxvs/client/gui/BaroxMenuScreen.class' \
            'com/baroxvs/client/gui/HudEditorScreen.class' \
            'com/baroxvs/client/gui/BaroxClothConfigScreen.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/gui/ModuleClickGuiScreen.class' \
            'com/baroxvs/client/hud/HudRenderer.class' \
            'com/baroxvs/client/hud/LyricFlowOverlay.class' \
            'com/baroxvs/client/config/BaroxConfig.class' \
            'com/baroxvs/client/cosmetic/CosmeticEngine.class' \
            'com/baroxvs/client/cosmetic/ModuleCatalog.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/cosmetic/CapeClothSimulation.class' \
            'com/baroxvs/client/audio/MusicEngine.class' \
            'com/baroxvs/client/render/SkyboxEngine.class' \
            'com/baroxvs/client/render/SkinStudio.class' \
            'com/baroxvs/client/render/HeldItemGlassRenderer.class' \
            'com/baroxvs/client/render/SelfGlassRenderer.class' \
            'com/baroxvs/client/mixin/PlayerGlassMixin.class' \
            'com/baroxvs/client/mixin/HeldItemFirstPersonGlassMixin.class' \
            'com/baroxvs/client/mixin/ItemLayerGlassMixin.class' \
            'com/baroxvs/client/mixin/PlayerHeldItemGlassMixin.class' \
            'com/baroxvs/client/theme/Themes.class' \
            'com/baroxvs/client/mixin/LocalSkinMixin.class' \
            'com/baroxvs/client/mixin/InGameHudMixin.class' \
            'assets/baroxvs/lang/tr_tr.json' \
            'assets/baroxvs/lang/en_us.json' \
            'assets/baroxvs/lang/de_de.json' \
            'assets/baroxvs/textures/misc/white.png' \
            'assets/baroxvs/textures/misc/cape_logo.png' \
            'assets/baroxvs/textures/misc/cape_body.png' \
            'assets/baroxvs/textures/misc/liquid_glass.png' \
            'assets/baroxvs/textures/misc/avatar_glass.png' \
            'assets/baroxvs/textures/misc/held_item_glass.png' \
            'baroxvs.mixins.json'; do
            grep -Fxq "$entry" project/build/jar-entries.txt
          done
          python3 - "$JAR" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              metadata = json.loads(jar.read('fabric.mod.json'))
              assert metadata['depends']['minecraft'] == '1.21.4'
              mixin_cfg = json.loads(jar.read('baroxvs.mixins.json'))
              assert mixin_cfg['required'] is True and mixin_cfg['injectors']['defaultRequire'] == 1
          PY
          sha256sum "$JAR"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v108
          path: |
