name: Build BAROX VS v017

on:
  push:
    branches: [ main, v014-visual-foundation, v017-animated-capes-rain ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble v006 base and apply v008/v009/v010/v011/v012/v013/v014/v016/v017 source patches
        shell: bash
        run: |
          set -euo pipefail
          cat source-v006-parts/part-*.b64 | base64 -d > /tmp/BAROX-VS-v006-source.tar.xz
          echo '387373d2331147df2f87ade18e44d67a84ac77f2176513af7877e7b6c7fdbc77  /tmp/BAROX-VS-v006-source.tar.xz' | sha256sum -c -
          mkdir -p project
          tar -xJf /tmp/BAROX-VS-v006-source.tar.xz -C project
          patch --batch --forward -d project -p1 < patches/v006-compile-fixes.patch
          xz -dc .github/scripts/apply-v007.py.xz > /tmp/apply-v007.py
          python3 /tmp/apply-v007.py project
          cat patches/v008/part-*.b64 | base64 -d | gzip -dc > /tmp/v008.patch
          patch --batch --forward -d project -p1 < /tmp/v008.patch
          cat patches/v009/part-*.b64 | base64 -d > /tmp/v009.patch.xz
          xz -t /tmp/v009.patch.xz
          xz -dc /tmp/v009.patch.xz > /tmp/v009.patch
          patch --batch --forward -d project -p1 < /tmp/v009.patch
          patch --batch --forward -d project -p1 < patches/v009-compile-fix.patch
          cat patches/v010-parts/part-*.b64 | base64 -d > /tmp/v010.patch.xz
          xz -t /tmp/v010.patch.xz
          xz -dc /tmp/v010.patch.xz > /tmp/v010.patch
          patch --batch --forward -d project -p1 < /tmp/v010.patch
          cat patches/v011-parts/part-*.b64 | base64 -d > /tmp/v011.patch.xz
          echo '394aa135a871f7bcd828e0829b3a1a113a9289754415ba9766b5509ac9993af6  /tmp/v011.patch.xz' | sha256sum -c -
          xz -t /tmp/v011.patch.xz
          xz -dc /tmp/v011.patch.xz > /tmp/v011.patch
          patch --batch --forward -d project -p4 < /tmp/v011.patch
          patch --batch --forward -d project -p4 < patches/v011-engine-fix.patch
          patch --batch --forward -d project -p4 < patches/v011-readme.patch
          cat patches/v012-parts/part-*.b64 | base64 -d > /tmp/v012.patch.xz
          echo '77d7ac6ff2cf7c930ecef0d87c3f6e53323d5671abc78c8c75cbeb259cec8d4f  /tmp/v012.patch.xz' | sha256sum -c -
          xz -t /tmp/v012.patch.xz
          xz -dc /tmp/v012.patch.xz > /tmp/v012.patch
          patch --batch --forward -d project -p4 < /tmp/v012.patch
          cat patches/v013-parts/part-*.b64 | base64 -d > /tmp/v013.patch.xz
          echo '11c683909d090101daddfd2bc83dca34c61fec700215fc229f0b66fb48252140  /tmp/v013.patch.xz' | sha256sum -c -
          xz -t /tmp/v013.patch.xz
          xz -dc /tmp/v013.patch.xz > /tmp/v013.patch
          patch --batch --forward -d project -p4 < /tmp/v013.patch
          cat patches/v014.patch.xz.b64 | base64 -d > /tmp/v014.patch.xz
          echo '858a9583962454b5b93dde45a559b40106ba91eebe1fcbb7c7a62e2f62622fda  /tmp/v014.patch.xz' | sha256sum -c -
          xz -t /tmp/v014.patch.xz
          xz -dc /tmp/v014.patch.xz > /tmp/v014.patch
          patch --batch --forward -d project -p1 < /tmp/v014.patch
          cat patches/v016-parts/part-*.b64 | base64 -d > /tmp/v016.patch.xz
          echo 'a0024f25c923d64cb71f44af6bd0877c19b71f4f7ff49fda1c5a372e3bda28d0  /tmp/v016.patch.xz' | sha256sum -c -
          xz -t /tmp/v016.patch.xz
          xz -dc /tmp/v016.patch.xz > /tmp/v016.patch
          patch --batch --forward -d project -p1 < /tmp/v016.patch
          patch --batch --forward -d project -p1 < patches/v016-build-fix.patch
          cat patches/v017-parts/part-*.b64 | base64 -d > /tmp/v017.patch.xz
          echo 'a985db016c073dca8204ef5159caedcecb99b7bc94c7fc9bf3bf2faabfdffea1  /tmp/v017.patch.xz' | sha256sum -c -
          xz -t /tmp/v017.patch.xz
          xz -dc /tmp/v017.patch.xz > /tmp/v017.patch
          patch --batch --forward -d project -p1 < /tmp/v017.patch
          tar -cJf BAROX-VS-v017-source.tar.xz -C project .

      - name: Verify v017 settings clarity, animated capes, chunk-wide rain and retained cosmetics
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'getDebugQuads|WorldRenderEvents\.AFTER_ENTITIES|^import .*ParticleTypes|^import .*ParticleEffect|\.addParticle\(' project/src/main/java; then
            echo 'Unexpected renderer path or vanilla particle API found.'
            exit 1
          fi
          grep -q 'getEntityTranslucent' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'FluidTags.WATER' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'FluidTags.WATER' project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          grep -q 'drawButterflyWing' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'drawButterflyParticle' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'private void renderHanfuOrnament' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'private void renderSilkRibbons' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'renderHeadwear' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'liquid_rain' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'customSkyColors' project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          grep -q 'slot-2.png' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'register(Module module)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'unregister(String id)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Chinese Straw Kasa' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Hanfu Hair Ornament' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'silk_ribbons' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'butterfly_swarm' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'CosmeticCatalog.WINGS, 0' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Twelve unique wing shapes' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'wingStyleVersion' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          for method in drawSeraphWing drawDemonWing drawDragonWing drawButterflyWing drawMothWing drawPhoenixWing drawFrostWing drawVoidWing drawSakuraWing drawAstralWing drawCyberWing drawWildvineWing; do
            grep -q "private void ${method}" project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          done
          grep -q 'Every style places glints on its own outer contour' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'default -> { // Wildvine branches and leaves' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'dimBackdrop' project/src/main/java/com/baroxvs/client/gui/Ui.java
          grep -q 'pageTransition' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'saveHudProfile' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'loadHudProfile' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'debug_overlay' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'drawDebugOverlay' project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          grep -q 'profileButton' project/src/main/java/com/baroxvs/client/gui/HudEditorScreen.java
          grep -q 'easeInOutCubic' project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('project/src/main/resources/assets/baroxvs/lang')
          files = ['en_us.json', 'de_de.json', 'tr_tr.json']
          data = {name: json.loads((path / name).read_text(encoding='utf-8')) for name in files}
          keys = set(data['en_us.json'])
          assert all(set(values) == keys for values in data.values()), 'language keys differ'
          PY
          grep -q 'moduleValue' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'openAudioConnection' project/src/main/java/com/baroxvs/client/audio/MusicEngine.java
          test -s project/src/main/java/com/baroxvs/client/gui/ModuleSettingsScreen.java
          grep -q 'cloth-config-fabric' project/build.gradle
          grep -q '"cloth-config"' project/src/main/resources/fabric.mod.json
          test -s project/src/main/resources/assets/baroxvs/textures/misc/white.png
          test -s project/src/main/java/com/baroxvs/client/gui/BaroxClothConfigScreen.java
          test -s project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          test -s project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          test -s project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          test -s project/src/main/resources/assets/baroxvs/lang/tr_tr.json
          python3 -m json.tool project/src/main/resources/fabric.mod.json > /dev/null
          python3 project/scripts/check_v013.py
          python3 project/scripts/check_v014.py
          python3 project/scripts/check_v015.py
          python3 project/scripts/check_v016.py
          python3 project/scripts/check_v017.py

      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v017.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          for entry in \
            'fabric.mod.json' \
            'com/baroxvs/client/BaroxVsClient.class' \
            'com/baroxvs/client/gui/BaroxMenuScreen.class' \
            'com/baroxvs/client/gui/HudEditorScreen.class' \
            'com/baroxvs/client/gui/BaroxClothConfigScreen.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/hud/HudRenderer.class' \
            'com/baroxvs/client/config/BaroxConfig.class' \
            'com/baroxvs/client/cosmetic/CosmeticEngine.class' \
            'com/baroxvs/client/audio/MusicEngine.class' \
            'com/baroxvs/client/render/SkyboxEngine.class' \
            'com/baroxvs/client/render/SkinStudio.class' \
            'com/baroxvs/client/theme/Themes.class' \
            'com/baroxvs/client/mixin/LocalSkinMixin.class' \
            'assets/baroxvs/lang/tr_tr.json' \
            'assets/baroxvs/lang/en_us.json' \
            'assets/baroxvs/lang/de_de.json' \
            'assets/baroxvs/textures/misc/white.png' \
            'baroxvs.mixins.json'; do
            grep -Fxq "$entry" project/build/jar-entries.txt
          done
          sha256sum "$JAR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v017
          path: |
            project/build/libs/BAROX-VS-v014.jar
            BAROX-VS-v017-source.tar.xz
          if-no-files-found: error
          retention-days: 30

      - name: Publish v017 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v017
          target_commitish: main
          name: BAROX VS v017
          body: |
            BAROX VS v017 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Fixes nested right-click module settings by replacing the vanilla/transparent background
            with an opaque, blur-free screen and crisp control panel.

            Makes all fifteen anime-inspired capes visibly animate even while idle, with smooth
            partial-tick motion, stronger movement/gliding/turn response, fabric folds and a rippling hem.

            Reworks Liquid Rain as deterministic world-space mesh ribbons across every client-loaded
            chunk within the configured view-distance square. It checks chunk-loaded state, distributes
            rain across the whole loaded area, and does not create rain particles or Spark objects.
            Density per chunk, streak length and opacity are configurable.

            Includes the v015 World Monitor and Player Vitals HUD cards, optional Overworld/Nether
            coordinate conversion, armor durability meters, and the v016 custom sky renderer repairs.

            Cloth Config API 17.0.144 remains required separately; GeckoLib remains optional and
            compile-time only. CI reconstructs the v014 source, applies v016 and v017, runs v013-v017
            static checks, compiles with Java 21/Gradle 8.12 and verifies JAR integrity. Live
            Android/ZalithLauncher and Sodium/Iris gameplay testing has not been performed.
          files: |
            project/build/libs/BAROX-VS-v016.jar
            BAROX-VS-v016-source.tar.xz
          generate_release_notes: true
