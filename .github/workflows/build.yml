name: Build BAROX VS v042

on:
  push:
    branches: [ main, v014-visual-foundation, v017-animated-capes-rain, v018-fairy-wardrobe-sky-studio, v019-glow-aura, v020-glass-studio, v021-clickgui-redesign, v022-cosmetic-expansion, v031-kimiko-visual-hud, v032-kimiko-sky-expansion, v032-build-fix, v033-kimiko-deep-visual-port, v034-kimiko-clickgui, v035-biome-discovery, v036-particleless-geometry, v037-realistic-motes, v038-cinematic-motes, v039-grouped-modules, v040-smooth-surfaces, v041-chat-hud-editor, v042-liquid-glass-power ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Reassemble v006 base and apply v008/v009/v010/v011/v012/v013/v014/v016/v017/v018 source patches
        shell: bash
        run: |
          set -euo pipefail
          cat source-v006-parts/part-*.b64 | base64 -d > /tmp/BAROX-VS-v006-source.tar.xz
          echo '387373d2331147df2f87ade18e44d67a84ac77f2176513af7877e7b6c7fdbc77  /tmp/BAROX-VS-v006-source.tar.xz' | sha256sum -c -
          mkdir -p project
          tar -xJf /tmp/BAROX-VS-v006-source.tar.xz -C project
          patch --batch --forward -d project -p1 < patches/v006-compile-fixes.patch
          xz -dc .github/scripts/apply-v007.py.xz > /tmp/apply-v007.py
          python3 /tmp/apply-v007.py project
          cat patches/v008/part-*.b64 | base64 -d | gzip -dc > /tmp/v008.patch
          patch --batch --forward -d project -p1 < /tmp/v008.patch
          cat patches/v009/part-*.b64 | base64 -d > /tmp/v009.patch.xz
          xz -t /tmp/v009.patch.xz
          xz -dc /tmp/v009.patch.xz > /tmp/v009.patch
          patch --batch --forward -d project -p1 < /tmp/v009.patch
          patch --batch --forward -d project -p1 < patches/v009-compile-fix.patch
          cat patches/v010-parts/part-*.b64 | base64 -d > /tmp/v010.patch.xz
          xz -t /tmp/v010.patch.xz
          xz -dc /tmp/v010.patch.xz > /tmp/v010.patch
          patch --batch --forward -d project -p1 < /tmp/v010.patch
          cat patches/v011-parts/part-*.b64 | base64 -d > /tmp/v011.patch.xz
          echo '394aa135a871f7bcd828e0829b3a1a113a9289754415ba9766b5509ac9993af6  /tmp/v011.patch.xz' | sha256sum -c -
          xz -t /tmp/v011.patch.xz
          xz -dc /tmp/v011.patch.xz > /tmp/v011.patch
          patch --batch --forward -d project -p4 < /tmp/v011.patch
          patch --batch --forward -d project -p4 < patches/v011-engine-fix.patch
          patch --batch --forward -d project -p4 < patches/v011-readme.patch
          cat patches/v012-parts/part-*.b64 | base64 -d > /tmp/v012.patch.xz
          echo '77d7ac6ff2cf7c930ecef0d87c3f6e53323d5671abc78c8c75cbeb259cec8d4f  /tmp/v012.patch.xz' | sha256sum -c -
          xz -t /tmp/v012.patch.xz
          xz -dc /tmp/v012.patch.xz > /tmp/v012.patch
          patch --batch --forward -d project -p4 < /tmp/v012.patch
          cat patches/v013-parts/part-*.b64 | base64 -d > /tmp/v013.patch.xz
          echo '11c683909d090101daddfd2bc83dca34c61fec700215fc229f0b66fb48252140  /tmp/v013.patch.xz' | sha256sum -c -
          xz -t /tmp/v013.patch.xz
          xz -dc /tmp/v013.patch.xz > /tmp/v013.patch
          patch --batch --forward -d project -p4 < /tmp/v013.patch
          cat patches/v014.patch.xz.b64 | base64 -d > /tmp/v014.patch.xz
          echo '858a9583962454b5b93dde45a559b40106ba91eebe1fcbb7c7a62e2f62622fda  /tmp/v014.patch.xz' | sha256sum -c -
          xz -t /tmp/v014.patch.xz
          xz -dc /tmp/v014.patch.xz > /tmp/v014.patch
          patch --batch --forward -d project -p1 < /tmp/v014.patch
          cat patches/v016-parts/part-*.b64 | base64 -d > /tmp/v016.patch.xz
          echo 'a0024f25c923d64cb71f44af6bd0877c19b71f4f7ff49fda1c5a372e3bda28d0  /tmp/v016.patch.xz' | sha256sum -c -
          xz -t /tmp/v016.patch.xz
          xz -dc /tmp/v016.patch.xz > /tmp/v016.patch
          patch --batch --forward -d project -p1 < /tmp/v016.patch
          patch --batch --forward -d project -p1 < patches/v016-build-fix.patch
          cat patches/v017-parts/part-*.b64 | base64 -d > /tmp/v017.patch.xz
          echo 'a985db016c073dca8204ef5159caedcecb99b7bc94c7fc9bf3bf2faabfdffea1  /tmp/v017.patch.xz' | sha256sum -c -
          xz -t /tmp/v017.patch.xz
          xz -dc /tmp/v017.patch.xz > /tmp/v017.patch
          patch --batch --forward -d project -p1 < /tmp/v017.patch
          patch --batch --forward -d project -p1 < patches/v017-build-fix.patch
          cat patches/v018-parts/part-*.b64 | base64 -d > /tmp/v018.patch.xz
          echo 'b569497fb9552338ef1343fca7101de5bd289569bef0afdc9682b5ed786058a5  /tmp/v018.patch.xz' | sha256sum -c -
          xz -t /tmp/v018.patch.xz
          xz -dc /tmp/v018.patch.xz > /tmp/v018.patch
          patch --batch --forward -d project -p1 < /tmp/v018.patch
          python3 .github/scripts/apply-v019.py project
      - name: Verify cumulative visual systems, v028 Lyric Flow, v029 sky stability and v030 HUD recode
        shell: bash
        run: |
          set -euo pipefail
          set -x
          # Legacy v018 check is retained for historical baseline validation. The v036 check below
          # enforces the global particleless geometry invariant across the complete runtime source.
          grep -q 'getEntityTranslucent' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'FluidTags.WATER' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'drawButterflyWing' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'drawButterflyParticle' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'private void renderHanfuOrnament' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'private void renderSilkRibbons' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'renderHeadwear' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'liquid_rain' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'slot-2.png' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'register(Module module)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'unregister(String id)' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Chinese Straw Kasa' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'Hanfu Hair Ornament' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'silk_ribbons' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'butterfly_swarm' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'CosmeticCatalog.WINGS, 0' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'wingStyleVersion' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          for method in drawSeraphWing drawDemonWing drawDragonWing drawButterflyWing drawMothWing drawPhoenixWing drawFrostWing drawVoidWing drawSakuraWing drawAstralWing drawWildvineWing; do
            grep -q "private void ${method}" project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          done
          grep -q 'Every style places glints on its own outer contour' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          grep -q 'default -> { // Wildvine branches and leaves' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'dimBackdrop' project/src/main/java/com/baroxvs/client/gui/Ui.java
          grep -q 'pageTransition' project/src/main/java/com/baroxvs/client/gui/BaroxMenuScreen.java
          grep -q 'saveHudProfile' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'loadHudProfile' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'debug_overlay' project/src/main/java/com/baroxvs/client/cosmetic/ModuleCatalog.java
          grep -q 'drawDebugOverlay' project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          grep -q 'profileButton' project/src/main/java/com/baroxvs/client/gui/HudEditorScreen.java
          grep -q 'easeInOutCubic' project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('project/src/main/resources/assets/baroxvs/lang')
          files = ['en_us.json', 'de_de.json', 'tr_tr.json']
          data = {name: json.loads((path / name).read_text(encoding='utf-8')) for name in files}
          keys = set(data['en_us.json'])
          assert all(set(values) == keys for values in data.values()), 'language keys differ'
          PY
          grep -q 'moduleValue' project/src/main/java/com/baroxvs/client/config/BaroxConfig.java
          grep -q 'openAudioConnection' project/src/main/java/com/baroxvs/client/audio/MusicEngine.java
          test -s project/src/main/java/com/baroxvs/client/gui/ModuleSettingsScreen.java
          grep -q 'cloth-config-fabric' project/build.gradle
          grep -q '"cloth-config"' project/src/main/resources/fabric.mod.json
          test -s project/src/main/resources/assets/baroxvs/textures/misc/white.png
          test -s project/src/main/java/com/baroxvs/client/gui/BaroxClothConfigScreen.java
          test -s project/src/main/java/com/baroxvs/client/hud/HudRenderer.java
          test -s project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          test -s project/src/main/java/com/baroxvs/client/render/SkyboxEngine.java
          test -s project/src/main/resources/assets/baroxvs/lang/tr_tr.json
          python3 -m json.tool project/src/main/resources/fabric.mod.json > /dev/null
          python3 project/scripts/check_v013.py
          python3 project/scripts/check_v014.py
          python3 project/scripts/check_v015.py
          python3 project/scripts/check_v016.py
          python3 project/scripts/check_v017.py
          python3 project/scripts/check_v018.py
          python3 .github/scripts/check-v019.py project
          python3 .github/scripts/apply-v020.py project
          python3 .github/scripts/check-v020.py project
          python3 .github/scripts/apply-v021.py project
          python3 .github/scripts/check-v021.py project
          python3 .github/scripts/apply-v022.py project
          python3 .github/scripts/check-v022.py project
          python3 .github/scripts/apply-v023.py project
          python3 .github/scripts/check-v023.py project
          python3 .github/scripts/apply-v024.py project
          python3 .github/scripts/check-v024.py project
          python3 .github/scripts/apply-v025.py project
          python3 .github/scripts/check-v025.py project
          python3 .github/scripts/apply-v026.py project
          python3 .github/scripts/check-v026.py project
          # Recreate the exact v026 source baseline used to author the v027 patch.
          sed -i 's/BAROX-VS-v018/BAROX-VS-v026/g' project/build.gradle
          sed -i 's/mod_version=0.18.0/mod_version=0.26.0/' project/gradle.properties
          printf 'BAROX VS v026\n' > project/VERSION
          python3 .github/scripts/apply-v027.py project
          python3 .github/scripts/check-v027.py project
          grep -q 'CapeClothSimulation' project/src/main/java/com/baroxvs/client/cosmetic/CosmeticEngine.java
          python3 .github/scripts/apply-v028.py project
          python3 .github/scripts/check-v028.py project
          grep -q 'playbackPositionMs()' project/src/main/java/com/baroxvs/client/audio/MusicEngine.java
          # Stamp the v028 base before applying the incremental v029 patch.
          sed -i 's/BAROX-VS-v027/BAROX-VS-v028/g' project/build.gradle
          sed -i 's/mod_version=0.27.0/mod_version=0.28.0/' project/gradle.properties
          printf 'BAROX VS v028\n' > project/VERSION
          grep -q 'BAROX-VS-v028.jar' project/build.gradle
          grep -q 'mod_version=0.28.0' project/gradle.properties
          python3 .github/scripts/apply-v029.py project
          python3 .github/scripts/check-v029.py project
          grep -q 'BAROX-VS-v029.jar' project/build.gradle
          grep -q 'mod_version=0.29.0' project/gradle.properties
          printf 'BAROX VS v029\n' > project/VERSION
          python3 .github/scripts/apply-v030.py project
          python3 .github/scripts/check-v030.py project
          sed -i 's/BAROX-VS-v029/BAROX-VS-v030/g' project/build.gradle
          sed -i 's/mod_version=0.29.0/mod_version=0.30.0/' project/gradle.properties
          printf 'BAROX VS v030\n' > project/VERSION
          grep -q 'BAROX-VS-v030.jar' project/build.gradle
          grep -q 'mod_version=0.30.0' project/gradle.properties
          python3 .github/scripts/apply-v031.py project
          python3 .github/scripts/check-v031.py project
          grep -q 'BAROX-VS-v031.jar' project/build.gradle
          grep -q 'mod_version=0.31.0' project/gradle.properties
          printf 'BAROX VS v031\n' > project/VERSION
          python3 .github/scripts/apply-v032.py project
          python3 .github/scripts/check-v032.py project
          grep -q 'BAROX-VS-v032.jar' project/build.gradle
          grep -q 'mod_version=0.32.0' project/gradle.properties
          printf 'BAROX VS v032\n' > project/VERSION
          grep -q 'BAROX VS v032' project/BUILD_VERSION.txt

          # Apply the additive v033 visual port to the fully reconstructed v032 source.
          cat patches/v033-parts/part-*.b64 | base64 -d > /tmp/v033.patch.gz
          gzip -t /tmp/v033.patch.gz
          gzip -dc /tmp/v033.patch.gz > /tmp/v033.patch
          patch --batch --forward -d project -p1 < /tmp/v033.patch
          python3 project/scripts/check_v033.py project
          grep -q 'BAROX-VS-v033.jar' project/build.gradle
          grep -q 'mod_version=0.33.0' project/gradle.properties
          printf 'BAROX VS v033\n' > project/VERSION
          grep -q 'BAROX VS v033' project/BUILD_VERSION.txt

          # Apply the Kimiko-inspired compact ClickGUI redesign as a BAROX-authored v034 port.
          cat patches/v034-parts/part-*.b64 | base64 -d > /tmp/v034.patch.gz
          echo 'e28699281d54440186a1586c3dcc26849ab3fb33888bd6540fbb7aabb23002ea  /tmp/v034.patch.gz' | sha256sum -c -
          gzip -t /tmp/v034.patch.gz
          gzip -dc /tmp/v034.patch.gz > /tmp/v034.patch
          patch --batch --forward -d project -p1 < /tmp/v034.patch
          patch --batch --forward -d project -p1 < patches/v034-build-fix.patch
          python3 project/scripts/check_v034.py project
          grep -q 'BAROX-VS-v034.jar' project/build.gradle
          grep -q 'mod_version=0.34.0' project/gradle.properties
          printf 'BAROX VS v034\\n' > project/VERSION
          grep -q 'BAROX VS v034' project/BUILD_VERSION.txt

          # Apply the additive v035 Biome Discovery HUD patch.
          cat patches/v035-parts/part-*.b64 | base64 -d > /tmp/v035.patch.gz
          gzip -t /tmp/v035.patch.gz
          gzip -dc /tmp/v035.patch.gz > /tmp/v035.patch
          patch --batch --forward -d project -p1 < /tmp/v035.patch
          python3 .github/scripts/check-v035.py project
          grep -q 'BAROX-VS-v035.jar' project/build.gradle
          grep -q 'mod_version=0.35.0' project/gradle.properties
          printf 'BAROX VS v035\n' > project/VERSION
          grep -q 'BAROX VS v035' project/BUILD_VERSION.txt

          # Apply the v036 particleless geometry rewrite.
          cat patches/v036-parts/part-*.b64 | base64 -d > /tmp/v036.patch.xz
          echo '6e80e4853e3d1d541f46d3feed5ef66bd51f130968f6fb103299b7f94c468935  /tmp/v036.patch.xz' | sha256sum -c -
          xz -t /tmp/v036.patch.xz
          xz -dc /tmp/v036.patch.xz > /tmp/v036.patch
          patch --batch --forward -d project -p1 < /tmp/v036.patch
          patch --batch --forward -d project -p1 < patches/v036-build-fix.patch
          python3 .github/scripts/check-v036.py project
          grep -q 'BAROX-VS-v036.jar' project/build.gradle
          grep -q 'mod_version=0.36.0' project/gradle.properties
          printf 'BAROX VS v036\\n' > project/VERSION
          grep -q 'BAROX VS v036' project/BUILD_VERSION.txt

          # Restore carefully bounded, physically integrated visual motes and specular wing glints.
          cat patches/v037-parts/part-*.b64 | base64 -d > /tmp/v037.patch.xz
          echo 'b996806ab35272e01aa976a7109f0a700ba12f693f53da15ffcfc92e4c6d3049  /tmp/v037.patch.xz' | sha256sum -c -
          xz -t /tmp/v037.patch.xz
          xz -dc /tmp/v037.patch.xz > /tmp/v037.patch
          patch --batch --forward -d project -p1 < /tmp/v037.patch
          sed -i 's/BAROX-VS-v036/BAROX-VS-v037/g' project/build.gradle
          sed -i 's/mod_version=0.36.0/mod_version=0.37.0/' project/gradle.properties
          sed -i 's/BAROX VS v036/BAROX VS v037/g' project/BUILD_VERSION.txt
          printf 'BAROX VS v037\n' > project/VERSION
          python3 .github/scripts/check-v037.py project
          grep -q 'BAROX-VS-v037.jar' project/build.gradle
          grep -q 'mod_version=0.37.0' project/gradle.properties
          grep -q 'BAROX VS v037' project/BUILD_VERSION.txt

          # Apply the v038 continuous trail and physically driven mote upgrade.
          cat patches/v038-parts/part-*.b64 | base64 -d > /tmp/v038.patch.xz
          echo '633a98fdff6d76adc4e6115e0d03b7c20665a2c4b1fbc456405dbef3af2ae238  /tmp/v038.patch.xz' | sha256sum -c -
          xz -t /tmp/v038.patch.xz
          xz -dc /tmp/v038.patch.xz > /tmp/v038.patch
          patch --batch --forward -d project -p1 < /tmp/v038.patch
          sed -i 's/BAROX-VS-v037/BAROX-VS-v038/g' project/build.gradle
          sed -i 's/mod_version=0.37.0/mod_version=0.38.0/' project/gradle.properties
          sed -i 's/BAROX VS v037/BAROX VS v038/g' project/BUILD_VERSION.txt
          printf '%s\n' 'BAROX VS v038' > project/VERSION
          python3 .github/scripts/check-v038.py project
          grep -q 'BAROX-VS-v038.jar' project/build.gradle
          grep -q 'mod_version=0.38.0' project/gradle.properties
          grep -q 'BAROX VS v038' project/BUILD_VERSION.txt

          # Apply the v039 parent/child module consolidation.
          base64 -d patches/v039.patch.gz.b64 > /tmp/v039.patch.gz
          echo '9f0493967de2ef4c7929b07649a5bf9c5e89395f53a2b3b929fdcaa52df28979  /tmp/v039.patch.gz' | sha256sum -c -
          gzip -t /tmp/v039.patch.gz
          gzip -dc /tmp/v039.patch.gz > /tmp/v039.patch
          patch --batch --forward -d project -p1 < /tmp/v039.patch
          python3 .github/scripts/check-v039.py project
          grep -q 'BAROX-VS-v039.jar' project/build.gradle
          grep -q 'mod_version=0.39.0' project/gradle.properties
          grep -q 'BAROX VS v039' project/BUILD_VERSION.txt

          # Apply the v040 smooth-surface visual rewrite.
          base64 -d patches/v040.patch.gz.b64 > /tmp/v040.patch.gz
          echo 'dc72ff4adabf23587e3a552faa504b28ea0437293bb855f58237a02af630abaa  /tmp/v040.patch.gz' | sha256sum -c -
          gzip -t /tmp/v040.patch.gz
          gzip -dc /tmp/v040.patch.gz > /tmp/v040.patch
          patch --batch --forward -d project -p1 < /tmp/v040.patch
          python3 .github/scripts/check-v040.py project
          grep -q 'BAROX-VS-v040.jar' project/build.gradle
          grep -q 'mod_version=0.40.0' project/gradle.properties
          printf 'BAROX VS v040\\n' > project/VERSION
          grep -q 'BAROX VS v040' project/BUILD_VERSION.txt

          tar -cJf BAROX-VS-v040-source.tar.xz -C project .

          # Apply v041 chat HUD controls and the redesigned Chinese Kasa.
          base64 -d patches/v041.patch.gz.b64 > /tmp/v041.patch.gz
          echo 'd4e5b752aed49f887d10f6207d7dd4de3b4b4482bd0df4cdd2f3dacbf80c4c67  /tmp/v041.patch.gz' | sha256sum -c -
          gzip -t /tmp/v041.patch.gz
          gzip -dc /tmp/v041.patch.gz > /tmp/v041.patch
          patch --batch --forward -d project -p1 < /tmp/v041.patch
          python3 .github/scripts/check-v041.py project
          grep -q 'BAROX-VS-v041.jar' project/build.gradle
          grep -q 'mod_version=0.41.0' project/gradle.properties
          printf 'BAROX VS v041\\n' > project/VERSION
          grep -q 'BAROX VS v041' project/BUILD_VERSION.txt

          tar -cJf BAROX-VS-v041-source.tar.xz -C project .

          # Apply the v042 iOS-inspired Liquid Glass material and visual-power systems.
          cat patches/v042/part-*.b64 | base64 -d > /tmp/v042.patch.gz
          echo 'cc413a08cce4481ed97dd669d863a4d272c40d930f76192bd26bcb1b1cc040d0  /tmp/v042.patch.gz' | sha256sum -c -
          gzip -t /tmp/v042.patch.gz
          gzip -dc /tmp/v042.patch.gz > /tmp/v042.patch
          patch --batch --forward -d project -p1 < /tmp/v042.patch
          python3 .github/scripts/check-v042.py project
          grep -q 'BAROX-VS-v042.jar' project/build.gradle
          grep -q 'mod_version=0.42.0' project/gradle.properties
          printf 'BAROX VS v042\n' > project/VERSION
          grep -q 'BAROX VS v042' project/BUILD_VERSION.txt

          tar -cJf BAROX-VS-v042-source.tar.xz -C project .

      - name: Build remapped Fabric mod
        run: gradle -p project clean build --no-daemon --stacktrace

      - name: Verify remapped Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='project/build/libs/BAROX-VS-v042.jar'
          test -s "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" > project/build/jar-entries.txt
          grep -Fxq "com/baroxvs/client/mixin/SkyRenderingMixin.class" project/build/jar-entries.txt
          if grep -Eq 'com/baroxvs/client/cosmetic/CosmeticEngine\\$(JumpRipple|VisualMote|TrailNode)\\.class' project/build/jar-entries.txt; then
            echo 'Transient particle/trail object classes must not be present'
            exit 1
          fi
          grep -Fxq "com/baroxvs/client/mixin/BackgroundRendererMixin.class" project/build/jar-entries.txt
          for entry in \
            'fabric.mod.json' \
            'com/baroxvs/client/BaroxVsClient.class' \
            'com/baroxvs/client/HudChatCommands.class' \
            'com/baroxvs/client/gui/BaroxMenuScreen.class' \
            'com/baroxvs/client/gui/HudEditorScreen.class' \
            'com/baroxvs/client/gui/BaroxClothConfigScreen.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/hud/HudRenderer.class' \
            'com/baroxvs/client/hud/LyricFlowOverlay.class' \
            'com/baroxvs/client/config/BaroxConfig.class' \
            'com/baroxvs/client/cosmetic/CosmeticEngine.class' \
            'com/baroxvs/client/cosmetic/ModuleCatalog.class' \
            'com/baroxvs/client/gui/ModuleSettingsScreen.class' \
            'com/baroxvs/client/cosmetic/CapeClothSimulation.class' \
            'com/baroxvs/client/audio/MusicEngine.class' \
            'com/baroxvs/client/render/SkyboxEngine.class' \
            'com/baroxvs/client/render/SkinStudio.class' \
            'com/baroxvs/client/theme/Themes.class' \
            'com/baroxvs/client/mixin/LocalSkinMixin.class' \
            'assets/baroxvs/lang/tr_tr.json' \
            'assets/baroxvs/lang/en_us.json' \
            'assets/baroxvs/lang/de_de.json' \
            'assets/baroxvs/textures/misc/white.png' \
            'baroxvs.mixins.json'; do
            grep -Fxq "$entry" project/build/jar-entries.txt
          done
          sha256sum "$JAR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BAROX-VS-v042
          path: |
            project/build/libs/BAROX-VS-v042.jar
            BAROX-VS-v042-source.tar.xz
          if-no-files-found: error
          retention-days: 30

      - name: Publish v042 GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v042
          target_commitish: main
          name: BAROX VS v042
          body: |
            BAROX VS v042 — Minecraft Java 1.21.4 / Fabric / Java 21.

            v042 introduces an iPhone-inspired Liquid Glass material system across ClickGUI, module settings and HUD widgets: layered translucent gradients, moving specular highlights, cool edge reflections, inner bevels and animated lens sheen. The shared glassPanel/glassButton primitives reduce duplicate rendering styles while preserving mobile compatibility. HUD widgets offer Liquid, Frosted, Solid and Neon glass materials. A Visual Power slider (0.55–1.85) controls per-module surface intensity, RGB exposure and alpha; related child features inherit their parent module's power. Wings, headwear, aura, player glass, pets, companions, sky, ambient forms, weather, meteor, shield, crystals, trails, halos and HUD effects are wired to the shared power system. Sky Studio applies the same setting to panorama brightness, sky layers and fog tint. Chat adds /barox hud power for per-widget control. The implementation uses layered translucent DrawContext rendering rather than framebuffer scene-sampling blur, avoiding shader/framebuffer compatibility risks. Existing v041 chat HUD positioning, T-to-chat behaviour, Chinese Straw Kasa redesign and existing module IDs remain preserved. CI checks the shared rendering paths, power inheritance, locale parity, Java 21 / Gradle 8.12 compilation and remapped JAR integrity. Live Minecraft/ZalithLauncher2 gameplay testing has not been performed.

            v041 removes the custom T-key HUD editor binding so T opens the normal Minecraft chat. The local /barox hud command tree lists 23 HUD widgets and supports per-widget X/Y position, scale, opacity, glass material (liquid, frosted, solid, neon), visibility toggling and reset. Settings are stored locally in the existing BAROX config; commands use Fabric's client-command API and are not sent to the server. The Chinese Straw Kasa is redesigned with a curved double-layer canopy, tiered sculpted crown, lotus-and-pearl crest, jade side ornaments and animated silk tassels. Existing module IDs and saved settings are preserved. CI checks independent widget settings, command coverage, TR/DE/EN locale parity, Java 21 / Gradle 8.12 compilation and remapped JAR integrity. Live Minecraft/ZalithLauncher2 gameplay testing has not been performed.

            v040 rewrites the visual renderers around filled, soft-gradient surfaces, broad overlapping radial blooms, shaded 3D volumes and rounded filled HUD elements. It removes transient mote/trail/jump-ripple objects, vanilla particle API usage, point-star and constellation-line rendering, narrow meteor/rain streaks, hollow outline rings and thin stroke helpers from the current visual paths. Wings use filled membranes and broad surface sheen; Sky Studio uses diffuse aurora/nebula/horizon haze; Aura, Halo, Ambient, shield and music effects use soft filled blooms; crosshair, FPS and compass widgets use filled rounded shapes. All 99 module IDs, 14 parent groups, 50 nested features and existing configuration IDs are preserved. CI verifies the no-particle/no-stroke rendering invariant, TR/DE/EN locale parity, Java 21 / Gradle 8.12 build and remapped JAR integrity. Live Minecraft/ZalithLauncher2 gameplay testing has not been performed.

            Previous release v039 — Minecraft Java 1.21.4 / Fabric / Java 21.

            v039 reorganizes 99 existing module IDs into 49 top-level entries and 14 parent groups, nesting 50 related child features. Wing effects, head accessories, companion settings, halo, Sky Studio, player glass, aura, ambient effects and HUD cards now appear beneath their corresponding parent modules. Parent switches gate child rendering; child styles and sliders remain available in the parent settings panel. Original child IDs and configuration values are preserved for existing profiles. The module browser and Active Visuals show parent modules rather than duplicate standalone child entries. Turkish, German and English translations remain in parity. Static validation checks group membership, child render gates, settings bindings, catalog counts and configuration compatibility. Live Minecraft/ZalithLauncher2 gameplay testing has not been performed.

            Previous release v038 — Minecraft Java 1.21.4 / Fabric / Java 21.

            v038 adds a continuous tapered Prism Trail ribbon based on sampled player motion, speed-aware motes with per-kind drag/lift/curl and camera-oriented streaks, slow Ambient Glass drift, and wing glints sampled from each selected articulated silhouette. The trail fades and narrows with age; effect counts remain capped and visible in BAROX Diagnostics. The renderer uses BAROX geometry and does not call Minecraft's vanilla particle API. Visual-only changes; 97 modules are preserved.

            v037 restores a deliberately bounded custom visual-mote system after the v036 particleless experiment. Prism trails now use motion-aware, fading motes with drag and slight lift; Ambient Glass adds slow drifting motes; wing glints travel over the articulated wing surface and add sparse flap-reactive glints. The BAROX Diagnostics HUD reports the active mote count. Motes are BAROX mesh sprites, not vanilla particle API calls; counts are capped by ambient density and old motes expire deterministically.

            BAROX VS v026 — Minecraft Java 1.21.4 / Fabric / Java 21.

            Replaces the old main menu entry with an animated module ClickGUI inspired by the interaction model of popular module clients, without adding cheat functionality.

            - Left-click: enable or disable a visual module.
            - Right-click: open the existing detailed settings screen, including styles and sliders.
            - Category sidebar: All, Effects, Trails, Cosmetics, HUD and Misc.
            - Live module search across names, descriptions and IDs.
            - All / ON / OFF filters and scrollable module cards.
            - Animated glass panels, hover highlights, toggle transitions and responsive sizing.
            - The original BAROX Visual Studio remains available from the Studio button.

            Carries forward v021's animated ClickGUI and v020's 44 sky presets, Glint, Music Aura Sync, six Jump Shapes, Butterfly Companion and Liquid Glass rendering.

            Adds 12 cosmetic modules: Meteor Shower, Energy Shield, Dragon Aura, Floating Crystals, RGB Outline, Celestial Wings, Footprint FX, Nameplate Designer, Weather Aura, Pet Companion, Cosmic Halo and Prism Trail. The pre-existing Wings catalogue and styles are preserved. Existing item transforms, movement, damage and combat behaviour are unchanged.


            v024 adds Module Resonance with Balanced, Brilliant, Soft and Prismatic presets. It samples the enabled Cosmetics, Effects and Trails modules, blends their stable colour signatures, and renders a restrained shared ring/sparkle finish. Active-module sampling is cached per client tick; HUD and utility modules are excluded.

            The module browser now uses a narrower-phone layout, shows the actual module count instead of a stale hard-coded value, and identifies the v024 build. Total catalogue: 91 unique module IDs.

            v025 animation overhaul: movement-aware spring-damped wing motion; two new Flight and Flow presets; frame-interpolated wing poses and scale; subtle feather-tip follow-through; smoother turn/velocity response for the cloth cape; higher-resolution two-strand silk-ribbon waves; butterfly wings that fold and reopen in alternating strokes; and an eased ClickGUI entrance. Existing four wing motion preset indices remain unchanged. All changes are cosmetic only.

            v026 replaces the ClickGUI with a polished client-style interface: compact category rail, live status header, animated module cards and toggle switches, search and ON/OFF filters, right-side module inspector, direct settings access, hover/selection transitions, and responsive sizing for narrow mobile viewports. All 91 visual modules are preserved. The interface does not add cheat, combat, movement or attack functions.

            v027 model and cape overhaul: replaces the particle-based cape/model accents with BAROX-authored connected 3D geometry. The cape now uses an 18x26 interpolated cloth grid, Verlet integration, structural/shear/bending constraints, damping, velocity/turn response and torso-clearance handling. Tailored seams, piping, stitched hem, woven sheen, shoulder tabs, clasp rings and an embroidered crest are built into the cape mesh. Wings gain sculpted shoulder sockets, a raised spine and direct geometric ribs. The companion becomes a faceted 3D orb model rather than a billboard. Model-related particle toggles and overlapping cosmetic modules are retired; the active visual catalogue is reduced from 91 to 78 entries. Geometry Detail replaces the old particle-density tuning for model quality. Config now uses config/baran3120.cfg; existing config/baroxvs.json is copied forward on first run and preserved. Old retired module states are migrated safely. Model and cape rendering remain cosmetic only.

            v028 adds BAROX-authored Lyric Flow: a glass HUD caption panel that follows the BAROX MP3 player's decoded PCM sample-frame playhead. It reads user-provided local LRC files from config/baran3120/captions.lrc, supports multiple timestamps per line, 1-3 digit fractional seconds, and positive/negative offset tags. Pausing freezes the timeline; stream buffering does not advance the cue clock. The file hot-reloads, is limited to 256 KB / 2,500 cues, and the module is opt-in in the HUD category. The main config/baran3120.cfg is not modified by caption loading. No LyricsFlow code, assets, Spotify/YouTube integration, or bundled song text is included. CI includes an isolated javac/java LRC parser runtime test in addition to the full Fabric build.
            CI runs v013-v030 static checks, compiles with Java 21 / Gradle 8.12 and verifies the remapped Fabric JAR. Live Android/ZalithLauncher, Sodium and Iris gameplay testing has not been performed.

            v029 fixes the broken world-sky pass. The previous camera-centred sky dome was submitted after terrain rendering in BEFORE_ENTITIES and could cover or corrupt the world image. BAROX no longer injects sky geometry into that late world pass; vanilla Minecraft sky rendering is left intact. Sky Mood remains as ambient cosmetic styling, and sky.png is validated safely with file-size and image-dimension limits. Custom panorama replacement is temporarily paused until it can be integrated into the dedicated vanilla sky pass and tested against alternate renderers. CI checks that SkyboxEngine no longer registers a world-render callback or submits custom world geometry, and validates the new labels in Turkish, German and English. Live Android/ZalithLauncher, Sodium and Iris gameplay testing has not been performed.
            v030 visual recode inspired by the user-supplied reference review: Dynamic Island combines local world/time context with BAROX music state and audio-reactive level; Active Visuals adds an animated list of enabled local effects/cosmetics/trails; HUD Studio adds Shift-click widget selection, individual widget drag positioning, resize handles, X/Y nudges and per-widget reset. Per-widget width/row/opacity/scale controls are available for the new modules. Turkish, German and English locales remain in key parity. The additions use BAROX-authored code and the existing safe HUD/layer/glass primitives; no third-party JAR code, shaders, textures, models or sounds were copied. CI verifies all 81 module IDs, HUD wiring, editor interactions, locale parity and preservation of the v029 vanilla sky fallback.

            v031 ports additional feature concepts observed in the user-supplied Kimiko client into original BAROX code for Minecraft 1.21.4: animated local KeyStrokes HUD, a 48-sample FPS history graph with average/frame-time readouts, a theme-aware Watermark, expanded Armor HUD (Compact/Detailed/Vertical), expanded Potion List (Compact/Detailed/Minimal, sorted by remaining time with a configurable 3–10 row cap), and four decorative Crosshair Ring styles. HUD Studio can position and resize the three new standalone widgets; all new UI text is localized in Turkish, German and English. The implementation only reads local player/key/effect/FPS state and adds no click automation, target tracking, combat controls or server actions. Kimiko's 1.21.11 bytecode, assets, shaders, models, sounds and embedded dependencies are not copied. Its reported root CC0 metadata is not assumed to override nested third-party licenses. CI runs the v031 static checks, Java 21/Gradle 8.12 build and remapped JAR verification. Live Minecraft/ZalithLauncher gameplay has not been performed.

            v032 is a full BAROX-authored sky and ambience expansion based on the user-supplied Kimiko feature inventory: eight Sky Studio palettes; optional 2:1 local panorama from config/baroxvs/sky.png with yaw/brightness controls and 16 MiB / 4096x2048 limits; animated aurora bands, extra stars/twinkle, nebula ribbons, meteor trails, constellation links and horizon glow; local day/night sky grading; and gentle fog-colour tinting. The new hooks use the dedicated Minecraft 1.21.4 SkyRendering celestial pass and BackgroundRenderer.getFogColor return value, not late WorldRenderEvents. Fog distance, weather, world time, server state, sun/moon and terrain rendering are not modified. Photo textures are released on reload/failure and bad images fall back to vanilla sky. The feature catalogue now contains 92 unique modules. No Kimiko bytecode, shaders, images, models, sounds or embedded libraries are copied; Kimiko targets 1.21.11 while BAROX targets 1.21.4, and the source archive notes an unrelated damaged PNG entry. CI runs cumulative checks through v032, Java 21 / Gradle 8.12 build and remapped Fabric JAR verification. Live Minecraft/ZalithLauncher, Sodium and Iris gameplay testing has not been performed.

            v033 adds a BAROX-authored visual port based on the supplied Kimiko feature inventory, adapted to Minecraft 1.21.4 rather than copying incompatible 1.21.11 bytecode. The Companion system now has eight distinct geometric silhouettes (Fox, Cat, Bunny, Dragonling, Wisp, Panda, Bee and Allay), four motion presets (Hover, Orbit, Shoulder, Follow), and optional theme-aware glow with separate scale/opacity. Jump Circle creates five styles of expanding ground ripple only on the local player's own jump. Crosshair Studio adds five local, theme-aware geometric reticle styles. The existing Aura presets now render as layered foot rings with an optional breathing pulse. All new module descriptions are translated in Turkish, German and English; the catalogue now contains 96 unique module IDs. Kimiko class files, mixins, shaders, textures, models, sounds, language files and embedded third-party libraries are not bundled; its compiled 1.21.11 package is not a compatible 1.21.4 source port. CI applies the v033 patch, runs 96-module/locale/feature checks, builds using Java 21 / Gradle 8.12 and verifies the remapped Fabric JAR. Live Minecraft/ZalithLauncher2/Sodium/Iris gameplay testing has not been performed.

            v034 rebuilds the primary ClickGUI around Kimiko's compact interaction hierarchy, adapted in BAROX-authored code for Minecraft 1.21.4: a centred 430x290 translucent window, narrow 110px category rail, compact two-column module cards, live search, All/On/Off filters, active indicators, scrollbar, theme chip, and a compact floating module-settings sheet. Existing 96 visual modules, category navigation, theme state, Studio shortcut, left-click toggle/style cycling and right-click settings navigation remain available. The previous oversized inspector is removed. No Kimiko bytecode, fonts, textures, shaders, sounds, models or libraries are copied. CI checks the panel proportions, interaction paths, module count, locale parity, patch integrity, Java 21/Gradle 8.12 build and remapped Fabric JAR. Live Android/ZalithLauncher2, Sodium and Iris gameplay testing has not been performed.
            v035 adds the BAROX-authored Biome Discovery HUD.

            v036 removes the transient Spark system, random emitters, per-sprite lifetime updates, ambient body objects, particle counters, and particle-frequency controls. Aura, orbit, halo, companion glow, wing highlights, weather, meteor, prism trail, footprints, jump ripple and music visualizer are now connected geometry only: continuous rings, surface ribbons, contour lines and attached meshes. Ambient bands are bounded and player-relative. The butterfly remains one articulated mesh and the cape remains one connected cloth surface. The v036 checker rejects particle classes, particle API calls, emitters and stale particle settings. Java 21 / Gradle 8.12 build and remapped JAR checks run in CI. Live Minecraft/ZalithLauncher2 gameplay testing has not been performed. It detects biome changes only when the player's block position changes, resolves the localized biome name, and displays an animated 3.8-second toast. Three styles are included (Liquid Glass, Minimal and Aurora Banner), with a 20-second per-biome cooldown to avoid boundary spam. The widget is selectable and configurable in HUD Studio, with Turkish, German and English localization. This is a local visual-only feature; it does not change movement, world state or server behaviour. The catalogue now contains 97 unique modules. The patch is independently checked before the Java 21 / Gradle 8.12 build and remapped JAR verification. Live Minecraft/ZalithLauncher2, Sodium and Iris gameplay testing has not been performed.
          files: |
            project/build/libs/BAROX-VS-v041.jar
            BAROX-VS-v041-source.tar.xz
          generate_release_notes: true
